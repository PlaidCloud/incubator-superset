nameOverride: ""
fullnameOverride: ""

image:
  repository: gcr.io/plaidcloud-build/superset/events:latest
  pullPolicy: IfNotPresent
  pullSecret: gcr-key

entrypoint:
  - python
  - /plaid/plaid/event_handler.py

configSecretName: plaid-superset-config-override

extraEnv:
  REDIS_HOST: plaid-superset-redis-headless
  REDIS_PORT: 6379

configMountPath: /app/pythonpath

resources:
  request:
    cpu: 100m
    memory: 256Mi
  limit:
    cpu: 1
    memory: 1Gi

nodeSelector: {}
affinity: {}
tolerations: []
