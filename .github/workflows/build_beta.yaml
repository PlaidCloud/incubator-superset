name: Beta Superset Build/Deploy
on:
  push:
    branches:
      - beta-*
jobs:
  build-beta:
    name: Beta Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Ensure python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Checkout code
        uses: actions/checkout@v3
#      - name: Acquire list of changed events files
#        id: all-events-files
#        continue-on-error: true
#        uses: tj-actions/changed-files@v38
#        with:
#          files: |
#            plaid/event_handler.py
#            plaid/requirements.txt
#            Dockerfile.events
      - name: Create tag
        id: docker_tag
        run: |
          echo "tag=${{ github.ref_name }}-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Verify tag
        run: echo ${{ steps.docker_tag.outputs.tag }}
      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      - name: Build superset and push
#        if: steps.all-events-files.outputs.only_changed == 'false'
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
          tags: us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:latest,us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:${{ steps.docker_tag.outputs.tag }}
#      - name: Build events and push
##        if: steps.all-events-files.outputs.any_changed == 'true'
#        id: docker_events_build
#        uses: docker/build-push-action@v3
#        with:
#          push: true
#          pull: true
#          no-cache: true
#          build-args: |
#            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
#          file: Dockerfile.events
#          tags: us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset-events:latest,us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset-events:${{ steps.docker_tag.outputs.tag }}

      - name: Checkout GitOps Repository
        uses: actions/checkout@v3
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          ref: beta
          fetch-depth: '1'
          path: infrastructure
          token: ${{ secrets.GITOPS_REPO_ACCESS }}

      - name: Update & Tenant Image
        # Used to also update control plane
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          branch: beta
          message: 'Update Superset Image to ${{ steps.docker_tag.outputs.tag }}'
          token: ${{ secrets.GITOPS_REPO_ACCESS }}
          workDir: infrastructure
          changes: |
            {
              "tenants/values.yaml": {
                "superset.image.tag": "${{ steps.docker_tag.outputs.tag }}",
                "events.image.tag": "${{ steps.docker_tag.outputs.tag }}"
              }
            }
