name: Beta Superset Build/Deploy
on:
  push:
    branches:
      - beta-*
jobs:
  build-beta:
    name: Beta Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        id: docker_tag
        run: |
          echo "tag=${{ github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT
      - name: Verify tag
        run: echo ${{ steps.docker_tag.outputs.tag }}
      - name: Login to GCR
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      - name: Build Superset
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: false
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG=${{ steps.docker_tag.outputs.tag }}
            INCLUDE_CHROMIUM=true
          tags: |
            us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:latest
            us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:${{ steps.docker_tag.outputs.tag }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:${{ steps.docker_tag.outputs.tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: true
      - name: Push image
        run: |
          docker push us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:${{ steps.docker_tag.outputs.tag }}
          docker push us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:latest
      - name: Checkout GitOps Repository
        uses: actions/checkout@v5
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          ref: beta
          fetch-depth: '1'
          path: infrastructure
          token: ${{ secrets.GITOPS_REPO_ACCESS }}

      - name: Update Tenant Image
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          branch: beta
          message: 'Update Superset Image to ${{ steps.docker_tag.outputs.tag }}'
          token: ${{ secrets.GITOPS_REPO_ACCESS }}
          workDir: infrastructure
          changes: |
            {
              "tenants/values.yaml": {
                "superset.image.tag": "${{ steps.docker_tag.outputs.tag }}"
              }
            }
