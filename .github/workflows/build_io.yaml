name: IO Superset Build/Deploy
on:
  push:
    branches:
      - develop-*
      - build-*
jobs:
  build-io:
    name: IO Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Ensure python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Checkout code
        uses: actions/checkout@v3
     - name: Create tag
        id: docker_tag
        run: |
          commit_tag=${GITHUB_REF#refs/*/}
          echo "tag=${commit_tag}-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Verify tag
        run: echo ${{ steps.docker_tag.outputs.tag }}
      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      - name: Build superset and push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
          tags: us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:latest,us-docker.pkg.dev/plaidcloud-build/us-plaidcloud/superset:${{ steps.docker_tag.outputs.tag }}

      - name: Checkout GitOps Repository
        uses: actions/checkout@v3
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          ref: master
          fetch-depth: '1'
          path: infrastructure
          token: ${{ secrets.GITOPS_REPO_ACCESS }}

      - name: Update Tenant Image
        # Used to also update control plane
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          branch: master
          message: 'Update Superset Image to ${{ steps.docker_tag.outputs.tag }}'
          token: ${{ secrets.GITOPS_REPO_ACCESS }}
          workDir: infrastructure
          changes: |
            {
              "tenants/values.yaml": {
                "superset.image.tag": "${{ steps.docker_tag.outputs.tag }}"
              }
            }

      # - name: Trigger ArgoCD Sync for CI Control Plane App
