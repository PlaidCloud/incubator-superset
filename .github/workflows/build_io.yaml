name: Build Superset for IO
on:
  push:
    branches:
      - develop-*
      - build-*
jobs:
  Deploy-IO-Superset:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Checkout code
        uses: actions/checkout@v3
      # - name: Install dependencies
      #   run: pip install -r requirements_frozen.txt; pip install pylint==2.13.5
      # - name: Run lint
      #   run: pylint workflow_runner -E
      - name: Create tag
        id: docker_tag
        run: |
          commit_tag=${GITHUB_REF#refs/*/}
          echo "tag=${commit_tag}-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Verify tag
        run: echo ${{ steps.docker_tag.outputs.tag }}
      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      - name: Build superset and push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
          tags: gcr.io/plaidcloud-build/superset:latest,gcr.io/plaidcloud-build/superset:${{ steps.docker_tag.outputs.tag }}
      - name: Build events and push
        id: docker_events_build
        uses: docker/build-push-action@v3
        with:
          push: true
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
          file: Dockerfile.events
          tags: gcr.io/plaidcloud-build/superset-events:latest,gcr.io/plaidcloud-build/superset-events:${{ steps.docker_tag.outputs.tag }}
