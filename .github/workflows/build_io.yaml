name: Build Superset for IO
on:
  push:
    branches:
      - develop-*
      - build-*
jobs:
  Deploy-IO-Superset:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Checkout code
        uses: actions/checkout@v3
#      - name: Acquire list of changed events files
#        id: all-events-files
#        continue-on-error: true
#        uses: tj-actions/changed-files@v38
#        with:
#          files: |
#            plaid/event_handler.py
#            plaid/requirements.txt
#            Dockerfile.events
      - name: Create tag
        id: docker_tag
        run: |
          commit_tag=${GITHUB_REF#refs/*/}
          echo "tag=${commit_tag}-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Verify tag
        run: echo ${{ steps.docker_tag.outputs.tag }}
      - name: Login to GCR
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}
      - name: Build superset and push
        # if: steps.all-events-files.outputs.only_changed == 'false'
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
          tags: gcr.io/plaidcloud-build/superset:latest,gcr.io/plaidcloud-build/superset:${{ steps.docker_tag.outputs.tag }}
      - name: Build events and push
        # if: steps.all-events-files.outputs.any_changed == 'true'
        id: docker_events_build
        uses: docker/build-push-action@v3
        with:
          push: true
          pull: true
          no-cache: true
          build-args: |
            PLAID_BUILD_TAG:${{ steps.docker_tag.outputs.tag }}
          file: Dockerfile.events
          tags: gcr.io/plaidcloud-build/superset-events:latest,gcr.io/plaidcloud-build/superset-events:${{ steps.docker_tag.outputs.tag }}

      - name: Checkout GitOps Repository
        uses: actions/checkout@v3
        with:
          repository: PlaidCloud/plaid-tenant-infrastructure
          ref: master
          fetch-depth: '1'
          path: infrastructure
          token: ${{ secrets.GITOPS_REPO_ACCESS }}

      - name: Update Tenant Image
        # Used to also update control plane
        uses: fjogeleit/yaml-update-action@main
        with:
          # valueFile: 'controlplane/environment-values/ci-cluster.yaml'
          repository: PlaidCloud/plaid-tenant-infrastructure
          branch: master
          message: 'Update Superset Image to ${{ steps.docker_tag.outputs.tag }}'
          token: ${{ secrets.GITOPS_REPO_ACCESS }}
          workDir: infrastructure
          changes: |
            {
              "tenants/values.yaml": {
                "superset.image.tag": "${{ steps.docker_tag.outputs.tag }}",
                "events.image.tag": "${{ steps.docker_tag.outputs.tag }}"
              }
            }

      # - name: Trigger ArgoCD Sync for CI Control Plane App
      #   uses: clowdhaus/argo-cd-action/@main
      #   timeout-minutes: 1
      #   env:
      #     ARGOCD_SERVER: deploy.plaidcloud.io
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # This might not be needed - Mostly used to avoid rate limiting
      #     ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      #   with:
      #     command: app sync ci-cluster-controlplane
      #     options: --grpc-web --prune --async
